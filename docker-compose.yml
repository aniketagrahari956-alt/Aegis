version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: threat_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: threat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threat_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/threat_db
      - JWT_SECRET=super_secret_jwt_key_change_me_in_production_12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - APP_NAME=AI Cyber Threat Detection Framework
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threat_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
